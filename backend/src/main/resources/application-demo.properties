# ==========================================
# Perfil `demo` (Fase 10, R5/R7) — se combina con `prod`: SPRING_PROFILES_ACTIVE=prod,demo
# ==========================================
# Activa el modo demo (DemoModeFilter: 403 DEMO_MODE en acciones destructivas) y
# carga los datos de demostración de db/demo/ (migración REPETIBLE, ajuste A1:
# corre siempre tras las versionadas y nunca bloquea una V24 futura).
app.demo.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/demo
