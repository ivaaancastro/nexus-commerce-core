spring.application.name=nexus-commerce-core

server.port=8080

# Conexión a PostgreSQL en Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/commerce_db
spring.datasource.username=dev_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway activado para migraciones controladas
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# Spring AI Configuration
# ==========================================
spring.ai.openai.api-key=${OPENAI_API_KEY:mock-key}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

# ==========================================
# PgVector & Embedding Configuration
# ==========================================
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.openai.embedding.options.model=text-embedding-3-small

# ==========================================
# OpenAPI & Swagger UI Configuration
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ==========================================
# JWT Configuration
# ==========================================
jwt.secret=${JWT_SECRET:my-super-secret-key-that-is-at-least-32-bytes-long-for-hs256}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Cargar variables de entorno desde el archivo .env (no versionado)
spring.config.import=optional:file:.env[.properties]

# ==========================================
# URL base del frontend (enlaces dentro de los emails)
# ==========================================
app.base-url=${APP_BASE_URL:http://localhost:3000}

# ==========================================
# Spring Mail Configuration
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true