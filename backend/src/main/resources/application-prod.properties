# ==========================================
# Perfil `prod` (Fase 10, R2) — despliegue público (Render + Neon)
# ==========================================
# Se activa con SPRING_PROFILES_ACTIVE=prod (o prod,demo para la demo pública).
# Todo lo sensible llega por variables de entorno: aquí no hay ni un secreto.

server.port=${PORT:8080}

# Datasource SIN valores por defecto: si faltan, el arranque falla en voz alta.
# Neon: DATABASE_URL=jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# Plan gratuito: pocas conexiones y reintento al despertar Neon (compute suspendido).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# SQL silenciado: show-sql en producción vuelca cada consulta al log.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT_SECRET obligatorio: JwtSecretGuard aborta si es el de ejemplo del repo o < 32 bytes (R3).
jwt.secret=${JWT_SECRET}

app.base-url=${APP_BASE_URL}

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
