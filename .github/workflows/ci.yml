name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (Java 21 + Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U nexus; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run backend tests
        working-directory: ./backend
        run: ./mvnw clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nexus_commerce
          SPRING_DATASOURCE_USERNAME: nexus
          SPRING_DATASOURCE_PASSWORD: nexus
          SPRING_AI_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend-tests:
    name: Frontend Tests (Vitest + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:coverage

      # Tarea 4.1 (R4): el informe se sube siempre, aunque los tests o el
      # build fallen — justo cuando más se necesita ver dónde está el hueco.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  # Tarea 4.2 (R6): el flujo transaccional comprueba navegador en navegador.
  # Va en paralelo (sin `needs:`) para no alargar el pipeline, y en espejo de
  # `backend-tests`: mismo servicio Postgres y mismo override de datasource
  # por variables de entorno, que es lo que hace que el backend conecte en CI
  # aunque `application.properties` apunte a `dev_user`/`commerce_db`.
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U nexus; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      # El override va en ESTE paso: es donde se lanza el proceso, y los
      # hijos heredan el entorno. Ponerlo en el paso de espera no haría nada.
      - name: Start backend
        working-directory: ./backend
        run: |
          ./mvnw -q spring-boot:run > /tmp/backend.log 2>&1 &
          echo "Backend lanzado en segundo plano"
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nexus_commerce
          SPRING_DATASOURCE_USERNAME: nexus
          SPRING_DATASOURCE_PASSWORD: nexus
          SPRING_AI_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Espera explícita ANTES de Playwright: `globalSetup` sólo aguanta 120 s
      # y un arranque frío de Maven en CI puede superarlos. Si no responde, se
      # vuelca el log — sin él, un backend caído es un timeout mudo.
      - name: Wait for backend
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/v1/markets > /dev/null; then
              echo "Backend listo tras ${i} intentos"
              exit 0
            fi
            sleep 2
          done
          echo "::error::El backend no respondió en 180 s"
          tail -100 /tmp/backend.log
          exit 1

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # Tarea 4.2 (D4): los 3 motores. `--with-deps` instala además las
      # bibliotecas del sistema que Firefox y WebKit necesitan en Linux.
      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        working-directory: ./frontend
        run: npm run test:e2e
        # Las credenciales de `pg` del `globalSetup`: en local tienen valores
        # por defecto (dev_user/commerce_db) y aquí se sustituyen por los del
        # servicio, siguiendo el mismo patrón que `SPRING_DATASOURCE_*`.
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: nexus
          PGPASSWORD: nexus
          PGDATABASE: nexus_commerce

      # Tarea 4.2 (R6): el informe se sube siempre, y es justo cuando falla
      # cuando más hace falta ver qué veía el navegador (traza + captura).
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
