name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (Java 21 + Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U nexus; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run backend tests
        working-directory: ./backend
        run: ./mvnw clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nexus_commerce
          SPRING_DATASOURCE_USERNAME: nexus
          SPRING_DATASOURCE_PASSWORD: nexus
          SPRING_AI_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend-tests:
    name: Frontend Tests (Vitest + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:coverage

      # Tarea 4.1 (R4): el informe se sube siempre, aunque los tests o el
      # build fallen — justo cuando más se necesita ver dónde está el hueco.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  # Tarea 4.2 (R6): el flujo transaccional comprueba navegador en navegador.
  # Va en paralelo (sin `needs:`) para no alargar el pipeline, y en espejo de
  # `backend-tests`: mismo servicio Postgres y mismo override de datasource
  # por variables de entorno, que es lo que hace que el backend conecte en CI
  # aunque `application.properties` apunte a `dev_user`/`commerce_db`.
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U nexus; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      # El override va en ESTE paso: es donde se lanza el proceso, y los
      # hijos heredan el entorno. Ponerlo en el paso de espera no haría nada.
      - name: Start backend
        working-directory: ./backend
        run: |
          ./mvnw -q spring-boot:run > /tmp/backend.log 2>&1 &
          echo "Backend lanzado en segundo plano"
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nexus_commerce
          SPRING_DATASOURCE_USERNAME: nexus
          SPRING_DATASOURCE_PASSWORD: nexus
          SPRING_AI_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Espera explícita ANTES de Playwright: `globalSetup` sólo aguanta 120 s
      # y un arranque frío de Maven en CI puede superarlos. Si no responde, se
      # vuelca el log — sin él, un backend caído es un timeout mudo.
      - name: Wait for backend
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/v1/markets > /dev/null; then
              echo "Backend listo tras ${i} intentos"
              exit 0
            fi
            sleep 2
          done
          echo "::error::El backend no respondió en 180 s"
          tail -100 /tmp/backend.log
          exit 1

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # Tarea 4.2 (D4): los 3 motores. `--with-deps` instala además las
      # bibliotecas del sistema que Firefox y WebKit necesitan en Linux.
      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        working-directory: ./frontend
        run: npm run test:e2e
        # Las credenciales de `pg` del `globalSetup`: en local tienen valores
        # por defecto (dev_user/commerce_db) y aquí se sustituyen por los del
        # servicio, siguiendo el mismo patrón que `SPRING_DATASOURCE_*`.
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: nexus
          PGPASSWORD: nexus
          PGDATABASE: nexus_commerce

      # Tarea 4.2 (R6): el informe se sube siempre, y es justo cuando falla
      # cuando más hace falta ver qué veía el navegador (traza + captura).
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # Tarea 4.3 (R4): presupuesto de Core Web Vitals + accesibilidad en
  # laboratorio. En paralelo (sin `needs:`), como `e2e-tests`, para no alargar
  # el pipeline.
  #
  # El backend se levanta igual que allí, y por la misma razón (D2): si no
  # responde, Lighthouse auditaría la página de error y el presupuesto saldría
  # verde sobre mentira. **La accesibilidad NO vive aquí** (D3): axe corre
  # dentro de `e2e-tests`, que ya recoge `e2e/a11y.spec.ts` por el `testDir`.
  cwv-audit:
    name: CWV Audit (Lighthouse)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U nexus; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      # El override va en ESTE paso: es donde se lanza el proceso. Mismo
      # patrón que `backend-tests` y `e2e-tests`.
      - name: Start backend
        working-directory: ./backend
        run: |
          ./mvnw -q spring-boot:run > /tmp/backend.log 2>&1 &
          echo "Backend lanzado en segundo plano"
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nexus_commerce
          SPRING_DATASOURCE_USERNAME: nexus
          SPRING_DATASOURCE_PASSWORD: nexus
          SPRING_AI_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Espera explícita: sin ella Lighthouse mediría un backend caído y el
      # presupuesto no significaría nada. Si no responde, se vuelca el log —
      # un timeout mudo no sirve para diagnosticar.
      - name: Wait for backend
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/v1/markets > /dev/null; then
              echo "Backend listo tras ${i} intentos"
              exit 0
            fi
            sleep 2
          done
          echo "::error::El backend no respondió en 180 s"
          tail -100 /tmp/backend.log
          exit 1

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # R1: Lighthouse no usa el Chrome del sistema — apunta al Chrome for
      # Testing de Playwright vía `CHROME_PATH` (scripts/lighthouse.mjs), la
      # misma binaria con la que corren los E2E. Sólo hace falta Chromium, y
      # `--with-deps` trae las bibliotecas de Linux sin las que no arranca.
      - name: Install Chromium for Lighthouse
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      # **El mismo comando que en local.** Si CI ejecutara una secuencia
      # distinta, el gate no sería el gate: se ejecuta `npm run audit:cwv`
      # tal cual, para que «verde en mi máquina» y «verde en CI» signifiquen
      # lo mismo. Falla con `expected`/`found` por cada umbral, así que un
      # rojo se diagnostica leyendo el log.
      - name: Run CWV audit
        working-directory: ./frontend
        run: npm run audit:cwv

      # Tarea 4.3 (R4): el informe se sube SIEMPRE. Cuando el presupuesto no
      # pasa es cuando más hace falta abrir el HTML y mirar el waterfall.
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/lighthouse-report/

  # Fase 11 (D1, D5, D7): despliegue a producción solo en push a main y solo
  # después de que los 4 jobs de calidad pasen. Si cualquiera falla, este job
  # no se ejecuta y no se despliega nada.
  deploy:
    name: Despliegue a producción (Render + Vercel)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, cwv-audit]
    if: github.ref == 'refs/heads/main'

    steps:
      # Fase 11 (R4, RNF4): detección de secretos antes de tocar producción.
      # Ninguna clave de Stripe ni JWT debe viajar versionada.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detección de secretos en el repo
        run: |
          echo "Buscando claves secretas en ficheros rastreados por git…"
          if git grep -E 'sk_(live|test)_|pk_(live|test)_|whsec_|JWT_SECRET' -- '(*.java|*.ts|*.tsx|*.properties|*.yml|*.yaml|*.json|*.md|*.sh|*.env*)' > /tmp/secrets.txt; then
            echo "::error::Se encontraron claves secretas en el repo:"
            cat /tmp/secrets.txt
            exit 1
          fi
          echo "No se encontraron claves secretas en el repositorio."

      # Fase 11 (R2): despliegue del backend a Render (servicio definido en render.yaml).
      - name: Desplegar backend a Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_BACKEND_SERVICE_ID" ]; then
            echo "::error::Faltan secrets de GitHub: RENDER_API_KEY y/o RENDER_BACKEND_SERVICE_ID"
            exit 1
          fi
          echo "Desplegando backend en Render (servicio $RENDER_BACKEND_SERVICE_ID)…"
          curl -s -X POST "https://api.render.com/v1/services/$RENDER_BACKEND_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" > /tmp/render-deploy.json
          if ! grep -q '"id"' /tmp/render-deploy.json; then
            echo "::error::El despliegue de Render no se aceptó:"
            cat /tmp/render-deploy.json
            exit 1
          fi
          echo "Despliegue de Render aceptado (ver /tmp/render-deploy.json)."

      # Fase 11 (R3): despliegue del frontend en Vercel.
      # Vercel ya despliega por integración Git en cada push a main; este paso
      # fuerza un despliegue nuevo y reporta la URL.
      - name: Desplegar frontend en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Faltan secrets de GitHub: VERCEL_TOKEN, VERCEL_ORG_ID y/o VERCEL_PROJECT_ID"
            exit 1
          fi
          echo "Desplegando frontend en Vercel (proyecto $VERCEL_PROJECT_ID)…"
          npx vercel@latest deploy --built --yes \
            --token "$VERCEL_TOKEN" \
            --org "$VERCEL_ORG_ID" \
            --project "$VERCEL_PROJECT_ID" \
            working-directory=frontend > /tmp/vercel-deploy.json 2>&1 || true
          if [ -f /tmp/vercel-deploy.json ] && grep -q '"url"' /tmp/vercel-deploy.json; then
            echo "URL de despliegue de Vercel:"
            grep '"url"' /tmp/vercel-deploy.json
          fi
          echo "Despliegue de Vercel iniciado."

      # Fase 11 (R8): verificación de humo post-despliegue.
      - name: Verificación de humo en producción
        run: |
          echo "Esperando a que la URL de producción responda…"
          for i in $(seq 1 30); do
            if curl -sf https://nexus-commerce-core.vercel.app/api/v1/markets > /dev/null; then
              echo "Producción lista tras ${i} intentos."
              exit 0
            fi
            echo "Intento ${i}/30: la producción aún no responde. Reintentando en 10 s…"
            sleep 10
          done
          echo "::error::La producción no respondió tras 5 minutos."
          exit 1
